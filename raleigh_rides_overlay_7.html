<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beginner Rides in the Raleigh Cycling Community</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --olive: #738A53;
    --moss: #5E763B;
    --mustard: #DEA027;
    --gold: #F2B705;
    --burnt-orange: #B84A00;
    --peach: #F3C1A0;
    --cream: #F3E4CA;
    --ochre: #E7A853;
    --sage: #90A477;
    --terracotta: #D97832;
    --frame: 24px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--gold);
  }

  /* ---------- Thin picture-frame marginalia ---------- */
  .sheet {
    display: grid;
    grid-template-rows: var(--frame) 1fr var(--frame);
    grid-template-columns: var(--frame) 1fr var(--frame);
    height: 100vh;
  }
  .frame-strip {
    background: var(--gold);
    color: #3a2c14;
    font-size: 8pt;
    line-height: var(--frame);
    white-space: nowrap;
    overflow: hidden;
  }
  .frame-top {
    grid-row: 1; grid-column: 1 / 4;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 8px;
  }
  .frame-bottom {
    grid-row: 3; grid-column: 1 / 4;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 8px;
  }
  .frame-left {
    grid-row: 2; grid-column: 1;
    display: flex; align-items: center; justify-content: center;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }
  .frame-right {
    grid-row: 2; grid-column: 3;
    display: flex; align-items: center; justify-content: center;
    writing-mode: vertical-rl;
  }
  .frame-top b, .frame-bottom b { color: var(--burnt-orange); font-weight: 700; }

  .map-area { grid-row: 2; grid-column: 2; position: relative; }
  #map { width: 100%; height: 100%; }

  /* ---------- Floating pop-out legend (overlay, not layout column) ---------- */
  .legend {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 1000;
    background: rgba(243,228,202,0.97);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    font-size: 12px;
    line-height: 1.5;
    max-width: 230px;
    max-height: calc(100% - 24px);
    overflow: hidden;
    border: 1px solid rgba(94,118,59,0.4);
  }
  .legend-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--terracotta);
    font-weight: 700;
    user-select: none;
  }
  .legend-header .chevron {
    transition: transform 0.2s ease;
    font-size: 11px;
  }
  .legend.collapsed .legend-header .chevron { transform: rotate(-90deg); }
  .legend-body {
    padding: 0 16px 12px 16px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    transition: max-height 0.2s ease, padding 0.2s ease;
  }
  .legend.collapsed .legend-body {
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    overflow: hidden;
  }
  .legend h3 {
    margin: 10px 0 6px 0;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--terracotta);
    font-weight: 700;
  }
  .legend h3:first-child { margin-top: 0; }
  .legend-item {
    display: flex;
    align-items: center;
    margin-bottom: 4px;
    cursor: pointer;
    color: #3a2c14;
  }
  .legend-swatch {
    width: 12px;
    height: 12px;
    margin-right: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.25);
  }

  /* Tile tint toward the warm palette */
  .leaflet-tile-pane {
    filter: sepia(0.25) saturate(1.15) hue-rotate(5deg) brightness(1.04);
  }
  .leaflet-overlay-pane path {
    stroke-width: clamp(3px, 0.55vh, 9px) !important;
  }

  .ride-popup h4 { margin: 0 0 6px 0; font-size: 13px; color: var(--terracotta); }
  .ride-popup table { border-collapse: collapse; font-size: 12px; }
  .ride-popup td { padding: 1px 6px 1px 0; vertical-align: top; }
  .ride-popup td:first-child { color: var(--moss); font-weight: 600; white-space: nowrap; }
  .popup-link { margin-top: 6px; font-size: 12px; }
  .popup-link a { color: var(--terracotta); }
</style>
</head>

  function dedupeStationary(points, minMoveMeters) {
    const out = [points[0]];
    for (let i = 1; i < points.length; i++) {
      const [lat1, lng1] = out[out.length - 1];
      const [lat2, lng2] = points[i];
      const dLat = (lat2 - lat1) * 111320;
      const dLng = (lng2 - lng1) * 111320 * Math.cos(lat1 * Math.PI / 180);
      if (Math.hypot(dLat, dLng) > minMoveMeters) out.push(points[i]);
    }
    return out;
  }
  function catmullRomSpline(points, numSegments) {
    if (points.length < 3) return points;

    for (let i = 0; i < n - 1; i++) {

      }
    }
    result.push(p[n-1]);

  const legend = document.getElementById('legend-body');
  document.getElementById('legend-toggle').addEventListener('click', () => {
    document.getElementById('legend').classList.toggle('collapsed');
  });
  const rideHeader = document.createElement('h3');
  rideHeader.textContent = 'Rides (by day)';
  legend.appendChild(rideHeader);

  rides.forEach(r => {
    let clickTarget;
    if (r.hasPath && r.coords) {
      const cleaned = cleanRoute(r.coords);
      const line = L.polyline(cleaned, {
        color: r.color, weight: 3, opacity: 0.85, smoothFactor: 1,
        lineJoin: 'round', lineCap: 'round'
      }).addTo(map);
      line.bindPopup(r.popupHtml);
      cleaned.forEach(c => allBounds.push(c));
      clickTarget = cleaned[Math.floor(cleaned.length / 2)];
    } else {
      const marker = L.circleMarker([r.lat, r.lng], {
        radius: 8, color: '#2f2412', weight: 1.5,
        fillColor: r.color, fillOpacity: 0.9
      }).addTo(map);
      marker.bindPopup(r.popupHtml);
      allBounds.push([r.lat, r.lng]);
      clickTarget = [r.lat, r.lng];
    }

    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = '<span class="legend-swatch" style="background:' + r.color + ';"></span>' + r.name;
    item.addEventListener('click', () => map.setView(clickTarget, 14));
    legend.appendChild(item);
  });

  const locHeader = document.createElement('h3');
  locHeader.textContent = 'Cycling Locations';
  legend.appendChild(locHeader);
  const locList = document.createElement('div');
  locList.style.fontSize = '12px';
  locList.style.color = '#3a2c14';

  const badgePopupMap = {
    "Jubala": "Jubala Friday Ride",
    "Crank Arm Brewing": "Crank Arm Wednesday Ride",
    "The Bike Library": "Tuesday Espresso Express"
  };
  const umsteadPopup = (function() {
    const names = ["The Umpstead Gravel Loop", "Umpstead Mountain Biking"];
    const matches = rides.filter(r => names.includes(r.name));
    const sections = matches.map(r => r.popupHtml).join('<hr style="margin:8px 0;border-color:#ccc;">');
    return '<div class="ride-popup"><h4>Umstead State Park</h4>' + sections + '</div>';
  })();

  badges.forEach(b => {
    const icon = L.divIcon({
      className: "badge-icon",
      html: '<div style="display:flex;align-items:flex-end;justify-content:center;width:100%;height:100%;">'
          + '<img src="' + b.img + '" style="width:clamp(60px, 10.8vh, 156px);height:auto;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35));" />'
          + '</div>',
      iconSize: [168, 168],
      iconAnchor: [84, 165],
      popupAnchor: [0, -158]
    });
    const marker = L.marker([b.lat, b.lng], { icon: icon }).addTo(map);
    let popupContent;
    if (b.name.indexOf("Umstead") !== -1) {
      popupContent = umsteadPopup;
    } else {
      const rideName = badgePopupMap[b.name];
      const matchedRide = rideName ? rides.find(r => r.name === rideName) : null;
      popupContent = matchedRide ? matchedRide.popupHtml : '<div class="ride-popup"><h4>' + b.name + '</h4></div>';
    }
    marker.bindPopup(popupContent, { maxWidth: 260 });
  });

  function updateScaleText() {
    const zoom = map.getZoom();
    const centerLat = map.getCenter().lat;
    const metersPerPixel = 156543.03392 * Math.cos(centerLat * Math.PI / 180) / Math.pow(2, zoom);
    const metersPerInchOnScreen = metersPerPixel * 96;
    const rf = Math.round(metersPerInchOnScreen / 0.0254);
    document.getElementById('scale-text').textContent =
      (metersPerInchOnScreen * 0.000621371).toFixed(2) + ' mi/in (approx. 1:' + rf.toLocaleString() + ')';
  }
  map.on('zoomend moveend', updateScaleText);
  updateScaleText();
</script>
